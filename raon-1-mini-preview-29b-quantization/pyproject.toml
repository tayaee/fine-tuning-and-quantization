[project]
name = "raon-mini-quantization"
version = "0.1.0"
description = "Raon-1-mini-preview PTQ-only quantization environment (DGX Spark, aarch64 + cu130)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.14.1",
    "accelerate==1.13.0",
    "datasets==4.8.4",
    "huggingface_hub==1.33.0",
    # 양자화·서빙·평가 (학습 스택 trl/peft/bitsandbytes 제외 — PTQ-only)
    "vllm==0.31.0",
    "hf-transfer==0.1.9",
    "openai==3.29.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# NOTE: llmcompressor는 여기서 설치하지 않는다. PyPI가 accelerate 핀으로
# resolver를 깨뜨리므로 10-setup.sh에서 --no-deps로 별도 설치한다.
# NOTE: UV_TORCH_BACKEND=cu130이 env에 있어야 cu130 휠로 해석된다.
